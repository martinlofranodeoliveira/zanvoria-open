<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10151b">
    <meta name="description" content="AETHER RIFT: WILDBOUND, um RPG de captura de criaturas em ilhas partidas por fendas arcanas.">
    <title>AETHER RIFT: WILDBOUND</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main id="shell" aria-label="AETHER RIFT: WILDBOUND">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="touch" aria-hidden="true">
        <div id="stick"><span></span></div>
        <button class="touch-btn" data-action="interact">E</button>
        <button class="touch-btn" data-action="dash">Shift</button>
        <button class="touch-btn wide" data-action="menu">Menu</button>
      </div>
      <div id="boot">Carregando fenda...</div>
    </main>
    <script src="js/platform-bridge.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
